site_name: Aerobox Games
site_url: https://aeroboxgames.com

nav:
  - Games: index.md
  - Element X: element-x.md
  - Rogue Racer: rogue-racer.md

theme:
  name: material
  palette:
    scheme: slate
    primary: black
  font:
    text: Roboto

  logo: assets/logo.png
  favicon: assets/logo.png

  features:
    - navigation.footer
    - navigation.tabs
    - navigation.tabs.sticky

plugins:
  - blog

extra:
  # generator: false
  social:
