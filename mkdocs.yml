    - icon: fontawesome/brands/discord
      link: https://www.instagram.com/aeroboxgames?utm_source=ig_web_button_share_sheet&igsh=ZDNlZDc0MzIxNw==
  generator: false

extra_css:
  - stylesheets/extra.css
  - stylesheets/main-page.css
  - stylesheets/element-x.css

